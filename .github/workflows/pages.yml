name: Hourly bazaar snapshot + deploy

on:
  schedule:
    - cron: "7 * * * *" # every hour (minute 7 to dodge the top-of-hour rush)
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    # Pages only deploys from the default branch, so pushes elsewhere just run the tests.
    # (Scheduled runs always use the default branch and carry no repository payload.)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          touch _site/.nojekyll

      - name: Snapshot bazaar prices
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }} # optional, the bazaar endpoint is public
        run: node scripts/snapshot.mjs --out _site/data --prev "${{ steps.pages.outputs.base_url }}/data/history.json"

      - name: Refresh craft recipes (daily, from the NEU repo)
        # Non-fatal: the site falls back to the recipes shipped in assets/data.
        continue-on-error: true
        run: node scripts/recipes.mjs --out _site/data --prev "${{ steps.pages.outputs.base_url }}/data/recipes.json" --max-age-hours 24

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
