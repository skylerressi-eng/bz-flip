name: Hourly bazaar snapshot + deploy

on:
  schedule:
    - cron: "7 * * * *" # every hour (minute 7 to dodge the top-of-hour rush)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          touch _site/.nojekyll

      - name: Snapshot bazaar prices
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }} # optional, the bazaar endpoint is public
        run: node scripts/snapshot.mjs --out _site/data --prev "${{ steps.pages.outputs.base_url }}/data/history.json"

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
